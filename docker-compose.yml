services:
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is for containers, HOST is for tools on your laptop (localhost:29092).
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Creates the three topics, then exits.
  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T="/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --replication-factor 1"
        $$T --topic eeg.raw      --partitions 12 --config retention.bytes=1073741824
        $$T --topic eeg.features --partitions 12 --config retention.ms=86400000
        $$T --topic eeg.events   --partitions 3  --config retention.ms=604800000

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: neuro
      POSTGRES_PASSWORD: neuro
      POSTGRES_DB: neuro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuro -d neuro"]
      interval: 3s
      timeout: 3s
      retries: 20

  gateway:
    build:
      context: .
      dockerfile: go.Dockerfile
      args:
        SERVICE: gateway
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-token}
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://neuro:neuro@postgres:5432/neuro
    ports:
      - "50051:50051"
    depends_on: &backends
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  processor:
    build:
      context: .
      dockerfile: go.Dockerfile
      args:
        SERVICE: processor
    environment:
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://neuro:neuro@postgres:5432/neuro
      LINKS_ENABLED: ${LINKS_ENABLED:-false}
      MIN_LINK_ANGLE_DEG: ${MIN_LINK_ANGLE_DEG:-40}
      POSITIONS_FILE: /positions.json
    volumes:
      - ./web/src/positions.json:/positions.json:ro # the same file the frontend uses
    restart: unless-stopped
    depends_on: *backends

  api:
    build:
      context: .
      dockerfile: go.Dockerfile
      args:
        SERVICE: api
    environment:
      API_TOKEN: ${INGEST_TOKEN:-dev-token}
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://neuro:neuro@postgres:5432/neuro
      S3_ENDPOINT: storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-neuro}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-neuro-dev-secret}
      S3_BUCKET: recordings
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on: *backends

  # S3-compatible file storage for uploads (SeaweedFS; S3 on AWS).
  storage:
    image: chrislusf/seaweedfs:4.53
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-neuro}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-neuro-dev-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"neuro","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -ip=storage -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0 \
          -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - storagedata:/data

  # Plays samples and uploads queued by the api.
  worker:
    build: ./replayer
    environment:
      DATABASE_URL: postgresql://neuro:neuro@postgres:5432/neuro
      GATEWAY: gateway:50051
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-token}
      S3_ENDPOINT: storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-neuro}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-neuro-dev-secret}
      S3_BUCKET: recordings
      SAMPLE_DIRS: /samples
      CACHE_DIR: /cache
    volumes:
      - ./data:/samples:ro
      - samplecache:/cache
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_API_TOKEN: ${INGEST_TOKEN:-dev-token}
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Terminal viewer, not part of the stack:  docker compose run --rm featuretail
  featuretail:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: go.Dockerfile
      args:
        SERVICE: tools/featuretail
    environment:
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://neuro:neuro@postgres:5432/neuro
    depends_on: *backends

volumes:
  pgdata:
  storagedata:
  samplecache:
