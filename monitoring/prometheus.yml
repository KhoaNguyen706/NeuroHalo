# Prometheus reads each service's /metrics every 5 seconds.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:9100"]
  # There can be several processors (docker compose up --scale processor=2);
  # the name resolves to all of them.
  - job_name: processor
    dns_sd_configs:
      - names: ["processor"]
        type: A
        port: 9100
        refresh_interval: 5s
  - job_name: api
    static_configs:
      - targets: ["api:9100"]
  # Consumer lag per group, read from Kafka by kafka-exporter.
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
